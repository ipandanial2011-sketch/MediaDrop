<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Downloader</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: #111;
  color: #eee;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 700px;
  margin: auto;
}

h1 {
  font-size: 24px;
  margin-bottom: 14px;
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border: 1px solid #444;
  border-radius: 8px;
  background: #1d1d1d;
  color: #fff;
  font-size: 15px;
}

button {
  background: #2b2b2b;
  cursor: pointer;
}

button:active {
  background: #444;
}

#status {
  margin: 12px 0;
  padding: 10px;
  background: #191919;
  border-radius: 8px;
  white-space: pre-wrap;
}

.filters {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.format {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 10px;
  margin: 6px 0;
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 8px;
}

.format-info {
  min-width: 0;
}

.format-name {
  font-weight: bold;
}

.format-details {
  color: #aaa;
  font-size: 12px;
  margin-top: 3px;
}

.format button {
  width: auto;
  min-width: 80px;
  margin: 0;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="container">

<h1>Media Downloader</h1>

<input
  id="url"
  type="url"
  placeholder="Paste video URL here"
  autocomplete="off"
>

<button onclick="getFormats()">Get Formats</button>

<div id="status">Ready.</div>

<div id="controls" class="hidden">

  <div class="filters">
    <select id="typeFilter" onchange="filterFormats()">
      <option value="all">All types</option>
      <option value="video">Video</option>
      <option value="audio">Audio</option>
    </select>

    <select id="qualityFilter" onchange="filterFormats()">
      <option value="all">All quality</option>
      <option value="2160">4K</option>
      <option value="1440">2K</option>
      <option value="1080">1080p</option>
      <option value="720">720p</option>
      <option value="480">480p</option>
      <option value="360">360p</option>
    </select>
  </div>

  <div id="formats"></div>

</div>

</div>

<script>
const API_PROXY =
  "https://royal-thunder-6999.ipandanial2011.workers.dev";

let allFormats = [];

function setStatus(text) {
  document.getElementById("status").textContent = text;
}

async function getFormats() {
  const videoUrl = document.getElementById("url").value.trim();

  if (!videoUrl) {
    setStatus("Paste a URL first.");
    return;
  }

  setStatus("Getting available formats...");
  document.getElementById("controls").classList.add("hidden");
  document.getElementById("formats").innerHTML = "";

  try {
    const response = await fetch(
      API_PROXY +
      "/formats?video_url=" +
      encodeURIComponent(videoUrl)
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Failed to get formats."
      );
    }

    allFormats = data.formats || data;

    if (!Array.isArray(allFormats)) {
      throw new Error("Unexpected format response.");
    }

    if (allFormats.length === 0) {
      setStatus("No downloadable formats found.");
      return;
    }

    document.getElementById("controls").classList.remove("hidden");

    setStatus(
      "Found " + allFormats.length + " format(s)."
    );

    renderFormats(allFormats);

  } catch (error) {
    setStatus(
      "Could not get formats:\n" +
      (error.message || "Failed to fetch.")
    );
  }
}

function filterFormats() {
  const type =
    document.getElementById("typeFilter").value;

  const quality =
    document.getElementById("qualityFilter").value;

  let filtered = allFormats.filter(format => {

    const text = JSON.stringify(format).toLowerCase();

    let typeOK = true;
    let qualityOK = true;

    if (type === "video") {
      typeOK =
        text.includes("video") ||
        text.includes("mp4") ||
        text.includes("webm");
    }

    if (type === "audio") {
      typeOK =
        text.includes("audio") ||
        text.includes("mp3") ||
        text.includes("flac") ||
        text.includes("m4a") ||
        text.includes("aac") ||
        text.includes("wav");
    }

    if (quality !== "all") {
      qualityOK =
        text.includes(quality + "p") ||
        text.includes(quality);
    }

    return typeOK && qualityOK;
  });

  renderFormats(filtered);
}

function renderFormats(formats) {
  const container =
    document.getElementById("formats");

  container.innerHTML = "";

  if (!formats.length) {
    container.innerHTML =
      "<p>No matching formats.</p>";
    return;
  }

  formats.forEach((format, index) => {

    const div = document.createElement("div");
    div.className = "format";

    const info = document.createElement("div");
    info.className = "format-info";

    const name = document.createElement("div");
    name.className = "format-name";

    const details = document.createElement("div");
    details.className = "format-details";

    const label =
      format.quality ||
      format.resolution ||
      format.format_note ||
      format.ext ||
      "Format " + (index + 1);

    name.textContent = label;

    details.textContent =
      [
        format.ext,
        format.format_id
          ? "ID: " + format.format_id
          : "",
        format.filesize
          ? format.filesize
          : "",
        format.fps
          ? format.fps + " FPS"
          : ""
      ]
      .filter(Boolean)
      .join(" • ");

    info.appendChild(name);
    info.appendChild(details);

    const button =
      document.createElement("button");

    button.textContent = "Download";

    button.onclick = () =>
      downloadFormat(format);

    div.appendChild(info);
    div.appendChild(button);

    container.appendChild(div);
  });
}

async function downloadFormat(format) {

  const videoUrl =
    document.getElementById("url").value.trim();

  const formatId =
    format.format_id ||
    format.id ||
    format.format;

  if (!formatId) {
    setStatus("This format has no format ID.");
    return;
  }

  setStatus("Starting download...");

  try {

    const response = await fetch(
      API_PROXY + "/download",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          url: videoUrl,
          format_id: formatId
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Download failed."
      );
    }

    const taskId =
      data.task_id ||
      data.id ||
      data.taskId;

    if (!taskId) {

      if (data.url) {
        window.open(data.url, "_blank");
        setStatus("Download link opened.");
        return;
      }

      throw new Error(
        "No download task ID returned."
      );
    }

    await monitor(taskId);

  } catch (error) {
    setStatus(
      "Download error:\n" +
      (error.message || "Unknown error.")
    );
  }
}

async function monitor(taskId) {

  setStatus("Processing...");

  for (;;) {

    await new Promise(
      resolve => setTimeout(resolve, 1500)
    );

    const response = await fetch(
      API_PROXY +
      "/status/" +
      encodeURIComponent(taskId)
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Status check failed."
      );
    }

    const status =
      String(
        data.status ||
        data.state ||
        ""
      ).toLowerCase();

    if (
      status === "completed" ||
      status === "complete" ||
      status === "finished" ||
      data.download_url ||
      data.url
    ) {

      await finish(taskId, data);
      return;
    }

    if (
      status === "failed" ||
      status === "error"
    ) {
      throw new Error(
        data.error ||
        data.message ||
        "Download processing failed."
      );
    }

    setStatus(
      "Processing..." +
      (data.progress != null
        ? " " + data.progress + "%"
        : "")
    );
  }
}

async function finish(taskId, statusData) {

  const directUrl =
    statusData.download_url ||
    statusData.url;

  if (directUrl) {
    window.open(directUrl, "_blank");
    setStatus("Download link opened.");
    return;
  }

  const response = await fetch(
    API_PROXY +
    "/download/" +
    encodeURIComponent(taskId)
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error(
      data.error || "Could not get download."
    );
  }

  const url =
    data.download_url ||
    data.url ||
    data.download;

  if (!url) {
    throw new Error(
      "No final download URL returned."
    );
  }

  window.open(url, "_blank");

  setStatus("Download link opened.");
}
</script>

</body>
</html>
