<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediaDrop</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: #111;
  color: #eee;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 700px;
  margin: auto;
}

h1 {
  font-size: 24px;
  margin-bottom: 14px;
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border: 1px solid #444;
  border-radius: 8px;
  background: #1d1d1d;
  color: #fff;
  font-size: 15px;
}

button {
  background: #2b2b2b;
  cursor: pointer;
}

button:active {
  background: #444;
}

#status {
  margin: 12px 0;
  padding: 10px;
  background: #191919;
  border-radius: 8px;
  white-space: pre-wrap;
}

.filters {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.section-title {
  margin-top: 18px;
  margin-bottom: 6px;
  font-size: 16px;
  font-weight: bold;
}

.choice {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 11px;
  margin: 6px 0;
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 8px;
}

.choice-info {
  min-width: 0;
}

.choice-name {
  font-weight: bold;
}

.choice-details {
  color: #999;
  font-size: 12px;
  margin-top: 3px;
}

.choice button {
  width: auto;
  min-width: 85px;
  margin: 0;
  flex-shrink: 0;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="container">

<h1>MediaDrop</h1>

<input
  id="url"
  type="url"
  placeholder="Paste video URL here"
  autocomplete="off"
>

<button onclick="getFormats()">Get Formats</button>

<div id="status">Ready.</div>

<div id="controls" class="hidden">

  <div class="filters">
    <select id="typeFilter" onchange="renderCleanFormats()">
      <option value="all">Video + Audio</option>
      <option value="video">Video only</option>
      <option value="audio">Audio only</option>
    </select>

    <select id="qualityFilter" onchange="renderCleanFormats()">
      <option value="all">All quality</option>
      <option value="2160">2160p / 4K</option>
      <option value="1440">1440p / 2K</option>
      <option value="1080">1080p</option>
      <option value="720">720p</option>
      <option value="480">480p</option>
      <option value="360">360p</option>
    </select>
  </div>

  <div id="formats"></div>

</div>

</div>

<script>
const API_PROXY =
  "https://royal-thunder-6999.ipandanial2011.workers.dev";

let rawFormats = [];
let cleanFormats = [];


function setStatus(text) {
  document.getElementById("status").textContent = text;
}


/*
  Try to get a useful numeric height from
  whatever field the downloader API gives us.
*/
function getHeight(format) {

  if (format.height) {
    return Number(format.height);
  }

  if (format.resolution) {
    const match =
      String(format.resolution).match(/(\d{3,4})p?/i);

    if (match) {
      return Number(match[1]);
    }
  }

  if (format.quality) {
    const match =
      String(format.quality).match(/(\d{3,4})p?/i);

    if (match) {
      return Number(match[1]);
    }
  }

  if (format.format_note) {
    const match =
      String(format.format_note).match(/(\d{3,4})p/i);

    if (match) {
      return Number(match[1]);
    }
  }

  return 0;
}


function getExtension(format) {
  return String(
    format.ext ||
    format.extension ||
    ""
  ).toLowerCase();
}


function isAudio(format) {

  const text =
    JSON.stringify(format).toLowerCase();

  const ext = getExtension(format);

  if (
    ext === "mp3" ||
    ext === "flac" ||
    ext === "wav" ||
    ext === "m4a" ||
    ext === "aac" ||
    ext === "opus" ||
    ext === "ogg"
  ) {
    return true;
  }

  if (
    format.acodec &&
    format.vcodec &&
    format.vcodec !== "none"
  ) {
    return false;
  }

  return (
    format.vcodec === "none" ||
    text.includes("audio only") ||
    text.includes("audio")
  );
}


function isVideo(format) {

  if (format.vcodec && format.vcodec !== "none") {
    return true;
  }

  const height = getHeight(format);

  return height > 0 && !isAudio(format);
}


function getBitrate(format) {

  const value =
    format.tbr ||
    format.abr ||
    format.bitrate ||
    format.audio_bitrate;

  if (!value) return "";

  const number = Number(value);

  if (!Number.isFinite(number)) {
    return "";
  }

  return Math.round(number) + " kbps";
}


function getVideoLabel(format) {

  const height = getHeight(format);

  if (height >= 2160) return "2160p";
  if (height >= 1440) return "1440p";
  if (height >= 1080) return "1080p";
  if (height >= 720) return "720p";
  if (height >= 480) return "480p";
  if (height >= 360) return "360p";

  return height ? height + "p" : "Video";
}


function getAudioLabel(format) {

  const ext = getExtension(format);
  const bitrate = getBitrate(format);

  if (ext === "flac") {
    return "FLAC";
  }

  if (ext === "mp3") {
    return bitrate
      ? "MP3 " + bitrate
      : "MP3";
  }

  if (ext === "wav") {
    return "WAV";
  }

  if (ext === "aac") {
    return bitrate
      ? "AAC " + bitrate
      : "AAC";
  }

  if (ext === "m4a") {
    return bitrate
      ? "M4A " + bitrate
      : "M4A";
  }

  if (ext === "opus") {
    return bitrate
      ? "Opus " + bitrate
      : "Opus";
  }

  if (ext === "ogg") {
    return bitrate
      ? "OGG " + bitrate
      : "OGG";
  }

  return "Audio";
}


/*
  Convert the messy API response into
  simple choices while keeping the original
  format object hidden inside each choice.
*/
function buildCleanFormats() {

  const choices = [];

  rawFormats.forEach(format => {

    const formatId =
      format.format_id ||
      format.id ||
      format.format;

    if (!formatId) return;

    if (isVideo(format)) {

      const height = getHeight(format);

      if (!height) return;

      choices.push({
        type: "video",
        label: getVideoLabel(format),
        height,
        ext: getExtension(format) || "video",
        format
      });

    } else if (isAudio(format)) {

      choices.push({
        type: "audio",
        label: getAudioLabel(format),
        height: 0,
        ext: getExtension(format) || "audio",
        format
      });
    }
  });


  /*
    Remove duplicate video choices.
    If multiple formats have the same resolution,
    prefer MP4 and then prefer the higher bitrate.
  */
  const videos = {};

  choices
    .filter(x => x.type === "video")
    .forEach(choice => {

      const key = choice.height;

      if (!videos[key]) {
        videos[key] = choice;
        return;
      }

      const current =
        videos[key].format;

      const currentExt =
        getExtension(current);

      const newExt =
        getExtension(choice.format);

      if (
        newExt === "mp4" &&
        currentExt !== "mp4"
      ) {
        videos[key] = choice;
        return;
      }

      const currentRate =
        Number(current.tbr || 0);

      const newRate =
        Number(choice.format.tbr || 0);

      if (newRate > currentRate) {
        videos[key] = choice;
      }
    });


  /*
    Remove duplicate audio extensions.
    Keep the highest bitrate for each extension.
  */
  const audios = {};

  choices
    .filter(x => x.type === "audio")
    .forEach(choice => {

      const key = choice.ext;

      if (!audios[key]) {
        audios[key] = choice;
        return;
      }

      const oldRate =
        Number(
          audios[key].format.abr ||
          audios[key].format.tbr ||
          0
        );

      const newRate =
        Number(
          choice.format.abr ||
          choice.format.tbr ||
          0
        );

      if (newRate > oldRate) {
        audios[key] = choice;
      }
    });


  cleanFormats = [
    ...Object.values(videos),
    ...Object.values(audios)
  ];

  cleanFormats.sort((a, b) => {

    if (a.type !== b.type) {
      return a.type === "video" ? -1 : 1;
    }

    if (a.type === "video") {
      return b.height - a.height;
    }

    return a.label.localeCompare(b.label);
  });
}


async function getFormats() {

  const videoUrl =
    document.getElementById("url").value.trim();

  if (!videoUrl) {
    setStatus("Paste a URL first.");
    return;
  }

  setStatus("Getting available formats...");

  document
    .getElementById("controls")
    .classList.add("hidden");

  document.getElementById("formats").innerHTML = "";

  try {

    const response = await fetch(
      API_PROXY +
      "/formats?video_url=" +
      encodeURIComponent(videoUrl)
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "Failed to get formats."
      );
    }

    rawFormats =
      data.formats ||
      data.results ||
      data;

    if (!Array.isArray(rawFormats)) {
      throw new Error(
        "Unexpected format response."
      );
    }

    buildCleanFormats();

    if (!cleanFormats.length) {
      throw new Error(
        "No recognizable formats were returned."
      );
    }

    document
      .getElementById("controls")
      .classList.remove("hidden");

    renderCleanFormats();

    setStatus(
      "Found " +
      cleanFormats.length +
      " clean format choices."
    );

  } catch (error) {

    setStatus(
      "Could not get formats:\n" +
      (error.message ||
      "Failed to fetch.")
    );
  }
}


function renderCleanFormats() {

  const container =
    document.getElementById("formats");

  container.innerHTML = "";

  const type =
    document.getElementById("typeFilter").value;

  const quality =
    document.getElementById("qualityFilter").value;


  const filtered =
    cleanFormats.filter(choice => {

      if (
        type !== "all" &&
        choice.type !== type
      ) {
        return false;
      }

      if (
        quality !== "all" &&
        choice.type === "video"
      ) {
        return choice.height ===
          Number(quality);
      }

      return true;
    });


  const videos =
    filtered.filter(
      choice => choice.type === "video"
    );

  const audios =
    filtered.filter(
      choice => choice.type === "audio"
    );


  if (videos.length) {

    const title =
      document.createElement("div");

    title.className = "section-title";
    title.textContent = "Video";

    container.appendChild(title);

    videos.forEach(renderChoice);
  }


  if (audios.length) {

    const title =
      document.createElement("div");

    title.className = "section-title";
    title.textContent = "Audio";

    container.appendChild(title);

    audios.forEach(renderChoice);
  }


  if (!filtered.length) {

    container.innerHTML =
      "<p>No matching formats.</p>";
  }
}


function renderChoice(choice) {

  const container =
    document.getElementById("formats");

  const div =
    document.createElement("div");

  div.className = "choice";


  const info =
    document.createElement("div");

  info.className = "choice-info";


  const name =
    document.createElement("div");

  name.className = "choice-name";
  name.textContent = choice.label;


  const details =
    document.createElement("div");

  details.className = "choice-details";

  const parts = [];

  if (choice.ext) {
    parts.push(
      choice.ext.toUpperCase()
    );
  }

  const bitrate =
    getBitrate(choice.format);

  if (bitrate) {
    parts.push(bitrate);
  }

  if (
    choice.format.fps &&
    choice.type === "video"
  ) {
    parts.push(
      choice.format.fps + " FPS"
    );
  }

  details.textContent =
    parts.join(" • ");


  info.appendChild(name);
  info.appendChild(details);


  const button =
    document.createElement("button");

  button.textContent = "Download";

  button.onclick = () =>
    downloadFormat(choice.format);


  div.appendChild(info);
  div.appendChild(button);

  container.appendChild(div);
}


async function downloadFormat(format) {

  const videoUrl =
    document.getElementById("url").value.trim();

  const formatId =
    format.format_id ||
    format.id ||
    format.format;

  if (!formatId) {
    setStatus(
      "This format has no format ID."
    );
    return;
  }

  setStatus("Starting download...");


  try {

    const response =
      await fetch(
        API_PROXY + "/download",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            url: videoUrl,
            format_id: formatId
          })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {
      throw new Error(
        data.error ||
        "Download failed."
      );
    }


    const taskId =
      data.task_id ||
      data.id ||
      data.taskId;


    if (!taskId) {

      if (data.url) {
        window.open(
          data.url,
          "_blank"
        );

        setStatus(
          "Download link opened."
        );

        return;
      }

      throw new Error(
        "No download task ID returned."
      );
    }


    await monitor(taskId);


  } catch (error) {

    setStatus(
      "Download error:\n" +
      (error.message ||
      "Unknown error.")
    );
  }
}


async function monitor(taskId) {

  setStatus("Processing...");


  for (;;) {

    await new Promise(
      resolve =>
        setTimeout(resolve, 1500)
    );


    const response =
      await fetch(
        API_PROXY +
        "/status/" +
        encodeURIComponent(taskId)
      );


    const data =
      await response.json();


    if (!response.ok) {
      throw new Error(
        data.error ||
        "Status check failed."
      );
    }


    const status =
      String(
        data.status ||
        data.state ||
        ""
      ).toLowerCase();


    if (
      status === "completed" ||
      status === "complete" ||
      status === "finished" ||
      data.download_url ||
      data.url
    ) {

      await finish(
        taskId,
        data
      );

      return;
    }


    if (
      status === "failed" ||
      status === "error"
    ) {

      throw new Error(
        data.error ||
        data.message ||
        "Download processing failed."
      );
    }


    setStatus(
      "Processing..." +
      (
        data.progress != null
          ? " " + data.progress + "%"
          : ""
      )
    );
  }
}


async function finish(
  taskId,
  statusData
) {

  const directUrl =
    statusData.download_url ||
    statusData.url;


  if (directUrl) {

    window.open(
      directUrl,
      "_blank"
    );

    setStatus(
      "Download link opened."
    );

    return;
  }


  const response =
    await fetch(
      API_PROXY +
      "/download/" +
      encodeURIComponent(taskId)
    );


  const data =
    await response.json();


  if (!response.ok) {
    throw new Error(
      data.error ||
      "Could not get download."
    );
  }


  const url =
    data.download_url ||
    data.url ||
    data.download;


  if (!url) {
    throw new Error(
      "No final download URL returned."
    );
  }


  window.open(
    url,
    "_blank"
  );


  setStatus(
    "Download link opened."
  );
}
</script>

</body>
  </html>
